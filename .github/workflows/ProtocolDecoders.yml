name: Protocol decoder sanitizers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate deterministic protocol fixtures
        run: |
          python3 scripts/generate_test_captures.py
          python3 scripts/generate_protocol_captures.py
          python3 scripts/generate_dns_captures.py
          python3 scripts/generate_reassembly_captures.py
          python3 scripts/generate_tcp_stream_captures.py
          python3 scripts/generate_partition_captures.py
          python3 scripts/generate_flow_captures.py
          python3 scripts/generate_inventory_captures.py
          python3 scripts/generate_tls_captures.py
          git diff --exit-code -- test/data
      - name: Build standalone decoder with sanitizers
        run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/packet_decoder.cpp test/unit/packet_decoder_test.cpp \
            -o build/packet_decoder_test
      - name: Run prefix, mutation, and random-input tests
        run: ./build/packet_decoder_test
      - name: Build and test DNS decoder with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/dns_decoder.cpp test/unit/dns_decoder_test.cpp \
            -o build/dns_decoder_test
          ./build/dns_decoder_test

      - name: Build and test TLS record parsing with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tls_record.cpp test/unit/tls_record_test.cpp \
            -o build/tls_record_test
          ./build/tls_record_test

      - name: Build and test TLS handshake pairing with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tcp_reassembly.cpp src/tls_handshake.cpp test/unit/tls_handshake_test.cpp \
            -o build/tls_handshake_test
          ./build/tls_handshake_test

      - name: Build and test protocol-independent TCP reassembly
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tcp_reassembly.cpp test/unit/tcp_reassembly_test.cpp \
            -o build/tcp_reassembly_test
          ./build/tcp_reassembly_test
      - name: Build and test DNS framing over the shared TCP core
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tcp_reassembly.cpp src/dns_tcp_framer.cpp test/unit/dns_tcp_framer_test.cpp \
            -o build/dns_tcp_framer_test
          ./build/dns_tcp_framer_test

      - name: Build and test payload-free session aggregation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/flow_aggregator.cpp test/unit/flow_aggregator_test.cpp \
            -o build/flow_aggregator_test
          ./build/flow_aggregator_test

      - name: Fuzz session lifecycle and conservation
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=fuzzer,address,undefined \
            -Isrc/include src/flow_aggregator.cpp test/unit/flow_aggregator_fuzz.cpp \
            -o build/flow_aggregator_fuzz
          ./build/flow_aggregator_fuzz -runs=20000 -max_len=4096

      - name: Build and test independent PCAP writer with sanitizers and libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev tcpdump
          mkdir -p build/pcap-writer
          c++ -std=c++11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -DPCAP_ORACLE \
            -Isrc/include src/pcap_writer.cpp test/unit/pcap_writer_test.cpp \
            -lpcap -o build/pcap_writer_test
          ./build/pcap_writer_test build/pcap-writer
          tcpdump -nn -r build/pcap-writer/udp.pcap

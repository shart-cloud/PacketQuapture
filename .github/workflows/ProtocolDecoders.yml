name: Protocol decoder sanitizers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate deterministic protocol fixtures
        run: |
          python3 scripts/generate_test_captures.py
          python3 scripts/generate_protocol_captures.py
          python3 scripts/generate_dns_captures.py
          python3 scripts/generate_reassembly_captures.py
          python3 scripts/generate_tcp_stream_captures.py
          python3 scripts/generate_partition_captures.py
          git diff --exit-code -- test/data
      - name: Build standalone decoder with sanitizers
        run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/packet_decoder.cpp test/unit/packet_decoder_test.cpp \
            -o build/packet_decoder_test
      - name: Run prefix, mutation, and random-input tests
        run: ./build/packet_decoder_test
      - name: Build and test DNS decoder with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/dns_decoder.cpp test/unit/dns_decoder_test.cpp \
            -o build/dns_decoder_test
          ./build/dns_decoder_test

      - name: Build and test protocol-independent TCP reassembly
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tcp_reassembly.cpp test/unit/tcp_reassembly_test.cpp \
            -o build/tcp_reassembly_test
          ./build/tcp_reassembly_test
      - name: Build and test DNS framing over the shared TCP core
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/include src/tcp_reassembly.cpp src/dns_tcp_framer.cpp test/unit/dns_tcp_framer_test.cpp \
            -o build/dns_tcp_framer_test
          ./build/dns_tcp_framer_test
